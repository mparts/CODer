#
# Settings for RUN.sh. A preset (og.conf, hub.conf) is read after this file and overrides it.
#

############################### Python Version
PYTHON="python3.12"


############################### Logging
LOG_FILE="./run.log"
APPEND_LOG=false


############################### Pipeline Stages
# TRAIN_* and PREDICT_* overwrite the shipped results in docs/experiments/archive/
DOWNLOAD_DATASET=false      # raw AIGCodeSet
PREPROCESS_DATASET=false    # raw data to the processed variants
FETCH_DATA=false            # processed variants from DATA_REPO, instead of the two above
PRINT_DATASET_STATS=false   # dataset composition, leakage and formatting checks
TRAIN_BASELINE=false        # LogReg, dev and test
TRAIN_CODEBERT=false        # TRANSFORMER_MODELS for each seed in SEEDS, dev and test, hours on the GPU
PREDICT_CODEBERT=false      # test predictions from the CKPT_REPO checkpoints
PAPER_TABLES=true           # Tables 2 and 5 from docs/experiments/archive/


############################### TRAINING VARIANTS
DATASETS="binary multiclass binary_generate multiclass_generate"
BASE_MODELS="word_LogReg char_LogReg"
TRANSFORMER_MODELS="unixcoder"
SEEDS="3 4 5 6 7 8"         # final runs, 0-2 were the tuning seeds


############################### Hugging Face
DATA_REPO="mparts/CODer-aigcodeset"
CKPT_REPO="mparts/CODer-unixcoder"

